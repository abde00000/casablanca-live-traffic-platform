name: casablanca-live-traffic

services:
  postgres-metastore:
    image: postgres:16
    container_name: casa-postgres-metastore
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hive_metastore}
      POSTGRES_USER: ${POSTGRES_USER:-hive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_local_password}
    volumes:
      - metastore-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hive} -d ${POSTGRES_DB:-hive_metastore}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  hive-metastore:
    build:
      context: .
      dockerfile: docker/hive/Dockerfile
    image: casablanca-live-traffic/hive-metastore:3.1.3
    container_name: casa-hive-metastore
    depends_on:
      postgres-metastore:
        condition: service_healthy
    environment:
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      SERVICE_OPTS: >-
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres-metastore:5432/${POSTGRES_DB:-hive_metastore}
        -Djavax.jdo.option.ConnectionUserName=${POSTGRES_USER:-hive}
        -Djavax.jdo.option.ConnectionPassword=${POSTGRES_PASSWORD:-change_this_local_password}
    volumes:
      - ./docker/hive/hive-site.xml:/opt/hive/conf/hive-site.xml:ro
      - ./data/warehouse:/opt/traffic-data/warehouse
    ports:
      - "127.0.0.1:9083:9083"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/9083'"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    container_name: casa-kafka
    hostname: kafka
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: casa-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: casablanca-live
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8082:8080"
    restart: unless-stopped

  spark-master:
    image: apache/spark:3.5.1
    container_name: casa-spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:8090:8080"
    volumes:
      - ./data:/opt/traffic-data
      - ./apps:/opt/spark-apps:ro
      - ./config:/opt/project/config:ro
      - ./sql:/opt/spark-sql:ro
      - ./docker/hive/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'exec 3<>/dev/tcp/spark-master/7077'"]
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped

  spark-worker:
    image: apache/spark:3.5.1
    container_name: casa-spark-worker
    hostname: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--webui-port", "8081"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    depends_on:
      spark-master:
        condition: service_healthy
      hive-metastore:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./data:/opt/traffic-data
      - ./apps:/opt/spark-apps:ro
      - ./config:/opt/project/config:ro
      - ./sql:/opt/spark-sql:ro
      - ./docker/hive/hive-site.xml:/opt/spark/conf/hive-site.xml:ro
    restart: unless-stopped

  traffic-collector:
    profiles: ["live"]
    build:
      context: .
      dockerfile: collector/Dockerfile
    image: casablanca-live-traffic/collector:1.0
    container_name: casa-traffic-collector
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: traffic-flow-raw
      TRAFFIC_LOCATIONS_FILE: /app/config/traffic_locations.csv
      REQUEST_BUDGET_FILE: /data/api_request_budget.json
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./config:/app/config:ro
      - ./data/collector:/data
    restart: "no"

volumes:
  metastore-db:
